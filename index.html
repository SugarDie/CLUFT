    <style>
        .hero { display: flex; align-items: center; justify-content: space-between; min-height: 60vh; gap: 40px; }
        .hero-text { flex: 1.2; }
        .hero-text h1 { font-size: 52px; font-weight: 800; line-height: 1.1; margin-bottom: 25px; letter-spacing: -1px; }
        .hero-text p { font-size: 19px; line-height: 1.7; opacity: 0.8; margin-bottom: 35px; }
        .cta-btn { display: inline-block; background: var(--text-color); color: var(--bg-color); padding: 16px 40px; border-radius: 40px; text-decoration: none; font-weight: 700; transition: transform 0.3s, box-shadow 0.3s; }
        .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }
        .hero-image { flex: 0.8; display: flex; justify-content: center; position: relative; }
        .hero-image .slipper-constructor { transform: scale(1.6); animation: floatSlipper 5s ease-in-out infinite; }
        @keyframes floatSlipper { 0%, 100% { transform: scale(1.6) translateY(0) rotate(0deg); } 50% { transform: scale(1.6) translateY(-20px) rotate(4deg); } }
    </style>
